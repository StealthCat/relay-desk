services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/repeaters.json:/app/config/repeaters.json:ro
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
