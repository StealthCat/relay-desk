services:
  dashboard:
    build: .
    ports:
      - target: 8080
        published: "${RELAY_DESK_PORT:-8080}"
        host_ip: "${RELAY_DESK_BIND_IP:-127.0.0.1}"
    volumes:
      - ./config/repeaters.json:/app/config/repeaters.json:ro
      - fleet-data:/app/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  fleet-data:
