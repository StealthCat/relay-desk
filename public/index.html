<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#24272b"><title>Relay Desk · openHop monitor</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><a href="/" class="brand"><span class="logo" aria-hidden="true">⌁</span> Relay Desk</a><span class="product">openHop monitor</span><span id="mode"></span></header><div class="layout"><aside><label for="node">REPEATER</label><select id="node"></select><button id="manage" type="button">Manage repeaters</button><p class="caption">MONITORING</p><nav aria-label="Monitoring sections" id="nav"></nav></aside><main><div class="mast"><div><div class="caption" id="station"></div><h1 id="title">Overview</h1></div><button id="refresh">↻ &nbsp; Refresh</button></div><p id="state" role="status">Connecting…</p><section class="panel" id="map-panel" hidden><h2>Position map</h2><p id="map-status" role="status"></p><div id="map-screen"></div></section><div id="content"></div></main></div><dialog id="manager" aria-labelledby="manager-title"><div class="dialog-head"><h2 id="manager-title">Manage repeaters</h2><button id="dismiss" type="button" aria-label="Close repeater manager">Close</button></div>
<div id="managed-list"></div>
<form id="add-form"><h3>Add repeater</h3><label for="repeater-name">Name</label><input id="repeater-name" maxlength="100" required autocomplete="off">
<label for="repeater-url">Repeater base URL</label><input id="repeater-url" type="url" placeholder="http://192.168.1.50:8000" required>
<label for="repeater-token">API token (optional)</label><input id="repeater-token" type="password" autocomplete="new-password">
<button type="submit">Add repeater</button></form><p id="manager-status" role="status"></p></dialog></body></html>
